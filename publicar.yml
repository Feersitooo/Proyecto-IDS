name: Publicar Biblioteca en Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: biblioteca-cloudflare
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_D1_ID: ${{ vars.CLOUDFLARE_D1_ID }}
      SITE_HOST: ${{ vars.SITE_HOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar herramientas en GitHub (no en tu computador)
        run: |
          python -m pip install uv==0.13.4
          npm ci
          uv sync --locked
      - name: Preparar y comprobar aplicación
        run: |
          uv run python scripts/configure_cloudflare.py
          uv run python scripts/prepare_cloudflare.py
      - name: Aplicar migraciones pendientes (conserva los datos existentes)
        run: uv run pywrangler d1 migrations apply biblioteca-mejorada --remote
      - name: Publicar
        run: uv run pywrangler deploy
